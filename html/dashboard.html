<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/dashboard.css">
    <title>Dashboard</title>
</head>
<body>
<div id="appDashboard" class="app-layout">

  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">📚</div>
      <div class="logo-text">
        <span class="app-name">SITTA</span>
        <span class="app-sub">Universitas Terbuka</span>
      </div>
    </div>

    <div class="sidebar-user">
      <div class="user-avatar">3</div>
      <div class="user-name">Test nanti disini muncul nama</div>
      <div class="user-role">Manajer</div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-label">Menu Utama</div>

      <div class="nav-item">
        <span class="nav-icon">🏠</span>
        <span>Dashboard</span>
      </div>

      <div class="nav-item" onclick="window.location.href='stok.html'">
        <span class="nav-icon">📦</span>
        <span>Informasi Bahan Ajar</span>
      </div>

      <div class="nav-item" onclick="window.location.href='tracking.html'">
        <span class="nav-icon">🚚</span>
        <span>Tracking Pengiriman</span>
      </div>

      <div
        class="nav-item"
        :class="{ open: showLaporanSubmenu }"
        @click="showLaporanSubmenu = !showLaporanSubmenu"
      >
        <span class="nav-icon">📊</span>
        <span>Laporan</span>
        <span class="nav-arrow">›</span>
      </div>

      <div class="nav-submenu" :class="{ open: showLaporanSubmenu }">
        <div
          class="nav-subitem"
          :class="{ active: currentSection === 'monitoring' }"
          @click="showSection('monitoring')"
        >
          <span>📈</span> Monitoring Progress DO
        </div>
        <div
          class="nav-subitem"
          :class="{ active: currentSection === 'rekap' }"
          @click="showSection('rekap')"
        >
          <span>📋</span> Rekap Bahan Ajar
        </div>
      </div>

      <div
        class="nav-item"
        :class="{ active: currentSection === 'histori' }"W
        @click="showSection('histori')"
      >
        <span class="nav-icon">🕐</span>
        <span>Histori Transaksi</span>
      </div>
    </nav>

    <div class="sidebar-footer">
      <button
        class="btn btn-outline btn-full btn-sm"
        @click="handleLogout"
        style="color:rgba(255,255,255,.6);border-color:rgba(255,255,255,.2)"
      >
        <span>🚪</span> <span><a href="../html/index.html">Logout</a></span>
      </button>
    </div>
  </aside>
</body>
</html>
